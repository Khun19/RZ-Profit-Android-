name: Build RZ Profit APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rz-profit-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head or event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source checkout and record build SHA
        id: source
        shell: bash
        env:
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_BUILD_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="$EXPECTED_EVENT_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            EXPECTED_SHA="$EXPECTED_PR_HEAD_SHA"
            test -n "$EXPECTED_SHA"
          fi
          if [[ "$ACTUAL_BUILD_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out SHA ($ACTUAL_BUILD_SHA) does not match expected source SHA ($EXPECTED_SHA)"
            exit 1
          fi
          echo "build_sha=$ACTUAL_BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified build source SHA: $ACTUAL_BUILD_SHA"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not configured on the GitHub runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Test inventory and sales calculations
        run: node --test tests/*.test.cjs
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK and calculate SHA-256
        shell: bash
        env:
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "^package: name='com.rz.profit'" apk-badging.txt
          echo "com.rz.profit" > package-id.txt
          sha256sum "$APK" | tee SHA256SUMS.txt
          ACTUAL_BUILD_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_BUILD_SHA" = "$BUILD_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$ACTUAL_BUILD_SHA" = "$PR_HEAD_SHA"
          fi
          {
            echo "source_commit=$ACTUAL_BUILD_SHA"
            echo "pr_head_sha=$PR_HEAD_SHA"
            echo "base_sha=$PR_BASE_SHA"
            echo "build_sha=$ACTUAL_BUILD_SHA"
            echo "verified_checkout_sha=$ACTUAL_BUILD_SHA"
            echo "event_name=$GITHUB_EVENT_NAME"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "package_id=com.rz.profit"
            echo "version=1.0.0"
          } > build-provenance.txt
      - name: Upload APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: rz-profit-debug-apk-${{ steps.source.outputs.build_sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
            build-provenance.txt
            package-id.txt
          if-no-files-found: error
          retention-days: 14
