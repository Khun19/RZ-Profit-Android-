name: Build RZ Profit APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rz-profit-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "^package: name='com.rz.profit'" apk-badging.txt
          echo "com.rz.profit" > package-id.txt
          sha256sum "$APK" | tee SHA256SUMS.txt
          {
            echo "source_commit=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "package_id=com.rz.profit"
            echo "version=1.0.0"
          } > build-provenance.txt
      - name: Upload APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: rz-profit-debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
            build-provenance.txt
            package-id.txt
          if-no-files-found: error
          retention-days: 14
